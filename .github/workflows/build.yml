name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip check

      - name: Compile check
        shell: pwsh
        run: |
          python -m compileall -q -f app.py core

      - name: Import smoke test
        shell: pwsh
        run: |
          python -c "import app; import core.automation; import core.game_input; import core.timezone; import core.window; print('Imports OK')"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --noupx --collect-all customtkinter --name PalworldExpeditionAssistant app.py
          if (-not (Test-Path "dist/PalworldExpeditionAssistant.exe")) { throw "EXE was not created" }
          Get-Item "dist/PalworldExpeditionAssistant.exe" | Format-List Name,Length,FullName

      - name: Publish latest Windows build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous latest release to delete."
            $global:LASTEXITCODE = 0
          }

          git tag -f latest
          git push origin refs/tags/latest --force

          gh release create latest "dist/PalworldExpeditionAssistant.exe#PalworldExpeditionAssistant.exe" `
            --title "Latest Windows Build" `
            --notes "Automatic Windows build from the latest main branch."
